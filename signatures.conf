# #############################################################################
# H. AI / LLM / ML / AGENT PLATFORMS
# (self-hosted AI front-ends and model servers are very often exposed with no
#  authentication, so they are worth naming precisely. Most of these are SPAs
#  or tiny plain-text roots, so the page <title> and the root text are the
#  main signals. NOTE Shiv only requests "/" (plus a few followed assets), so
#  API-only signals such as /api/tags or /v1/models can only match when the
#  server happens to answer them on "/" or when they appear in followed JSON.)
# #############################################################################

# OpenClaw (formerly Clawdbot, then Moltbot): Gateway on :18789 serving a
# Vite + Lit single-page "Control UI" from "/" (or from gateway.controlUi.basePath).
# Verified index.html: <title>OpenClaw Control</title> and <openclaw-app>.
# The Gateway also serves /__openclaw/control-ui-config.json and a canvas host
