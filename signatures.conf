# #############################################################################
# G. CDN / WAF / HOSTING / EDGE INFRASTRUCTURE
# #############################################################################

# =============================================================================
# Imperva / Incapsula WAF Detection
#
# field_any_nonempty now checks the raw response headers directly (any
# header, not just a fixed pre-registered list), and body_contains checks
# the whole lowercased body -- not just href="..." attributes or HTML
# comments. So this block is fully self-contained: add/remove lines here to
# tune detection, no C++ changes required. Header names below use the
# underscore convention (x_iinfo == "X-Iinfo" header) purely by house style;
