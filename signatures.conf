# =============================================================================
# signatures_additions.conf  --  NEW platforms + terms only. No platform name or
# [terms] needle below exists in your signatures.conf (checked against every
# existing [platform.*] name, [terms] needle and [terms] product name).
# Exception by design: [platform.X] blocks for products that existed only as
# [terms] (Sails.js, Play Framework, Unpoly, Stimulus, Buffalo, SmarterMail,
# MailEnable, Stalwart Mail, Brother, Anchor) so they gain structural scoring,
# and an Axigen [terms] line for the existing Axigen platform.
#
# HOW TO MERGE (your file notes [platform.*] sections should sit BEFORE [terms]):
#   PART A  ([platform.*] blocks)  -> paste just above the line
#           "# [terms] additions (high-signal, low false-positive ...)" (~line 955),
#           i.e. after the last existing [platform.*] block.
#   PART B  ([terms] lines)        -> paste at the very end of signatures.conf.
#   (Sections may repeat and accumulate, so no existing section is touched.)
#
# DESIGN (same rules as your header):
#   * Every platform block can exceed the score > 1 threshold from one specific
#     hit (title / product-specific path / header / cookie / unique string, weight
#     2-3). Generic words that could appear in unrelated pages are weight 1 and
#     only count as corroboration.
#   * Terms use the spec flags already used in your file. Hardware vendors
#     (routers, cameras, PBX phones, printers, ICS) default to B0 so a vendor
#     name in page TEXT alone never reports; title/header/banner hits (T/H/X)
#     and the platform rules above carry the detection.
#   * Cookie and header-NAME needles use your own idioms:
#       cookie  -> A0,H3,hdr:set-cookie,sub,nover
#       header  -> N3,sub,nover
#   * Products with no distinctive network-visible fingerprint (stunnel, Hitch,
#     Pound, sniproxy, Dante, Shadowsocks, Nebula, Algo, Streisand, PiVPN,
#     Ocelot, Gleam) are intentionally NOT added: a made-up signature would only
#     add false positives.
# =============================================================================


