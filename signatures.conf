[platform.OpenResty]
# The real-world signal for OpenResty is almost always the Server header
# itself -- OpenResty is nginx + LuaJIT and by default reports itself as
# "Server: openresty" or "Server: openresty/1.21.4.1" (the version-bearing
# form is what also lets it show up on the version line via
# [identity_headers]'s existing "Server" row). The X-Openresty-* headers
