# -----------------------------------------------------------------------------
# [identity_headers]
# header|label|bare
#
# Drives the tech-identity portion of the -sV version line (see
# print_result() / kMaxSlots in control.cpp). Every response header is
# already captured generically into HttpFingerprint::raw_headers, so a new
# header shows up on the version line the moment you add a row here --
# no C++ struct field, no extract_header() call, no recompile.
#
#   header : HTTP response header name, case-insensitive.
#   label  : text shown on the version line.
#   bare   : true  = value is already self-descriptive, printed as-is
#                     (e.g. Server: "cloudflare" -> cloudflare)
#            false = value is a bare token/number, printed as "label: value"
#                     (e.g. X-Jenkins: "2.440.3" -> Jenkins: 2.440.3)
#
# Order does not matter -- printed order is decided in control.cpp by slot
# priority (product/version > Server > app identity > everything else),
# not by the order of rows here.
# -----------------------------------------------------------------------------
[identity_headers]
Server|Server|true
osd-name|OSD-Name|true
X-Powered-By|X-Powered-By|true
X-Generator|X-Generator|true
X-Aspnet-Version|ASP.NET|true
X-AspNetMvc-Version|ASP.NET MVC|true
X-Powered-By-Plesk|PleskWin|true
X-Jenkins|Jenkins|false
X-Hudson|Hudson|false
X-TeamCity-Node-Id|TeamCity|false
X-Gitlab-Meta|GitLab|false
x-harness-account|Harness|false
X-WordPress-Theme|WordPress Theme|false
X-WordPress-Plugin|WordPress Plugin|false
X-Drupal-Route|Drupal Route|false
X-Magento-Store|Magento Store|false
X-Magento-Theme|Magento Theme|false
X-Prestashop-Store|PrestaShop Store|false
X-CDN|CDN|false
X-Mailer|Mailer|false
Via|Via|true
X-Cache|X-Cache|true
X-Cache-Status|Cache-Status|true
X-Cache-Lookup|Cache-Lookup|true
X-Cache-Hits|Cache-Hits|false
X-Served-By|Served-By|true
X-Backend-Server|Backend|true
X-Upstream|Upstream|true
X-Runtime|Runtime|false
X-Varnish|Varnish|false
X-LiteSpeed-Cache|LiteSpeed-Cache|true
X-Vercel-Id|Vercel-Id|false
X-Vercel-Cache|Vercel-Cache|true
