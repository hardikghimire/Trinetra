# Platform>=N|SuppressedPlatform
# If 'Platform' scored >= N, force 'SuppressedPlatform' score to 0 (avoids
# double-reporting a meta-framework's underlying library, e.g. Next.js implies
# React, and avoids a generic server/language "tying" with the application
# that actually matters -- the Server header is still printed on the version
# line via [identity_headers] either way).
# -----------------------------------------------------------------------------
