# -----------------------------------------------------------------------------
# [platform.NAME]
# One section per platform/framework being scored. Each line is a rule:
#   kind|arg|weight
#
# kind is one of:
#   path_contains           arg = substring to find in any recorded path entry
#                            (matches the "[label] ..." entries from [paths]).
#                            NOTE: only scans href="..." attribute values --
#                            use body_contains below for src=, plain text, etc.
#   jsglobal_eq              arg = exact string to match against a recorded
#                            js-global/attr entry (e.g. "window.Drupal" or
#                            "attr:ng-app")
#   comment_contains         arg = substring to find in any HTML comment
#                            (only comments containing one of a small built-in
#                            keyword list such as "powered by" / "generated by"
#                            are recorded at all -- use body_contains for
#                            anything else)
#   meta_generator_contains  arg = substring to find in the <meta name=generator>
#                            value (case-sensitive)
#   field_any_nonempty       arg = comma-separated list of HTTP response header
#                            names, e.g. "X-Iinfo" or "x_iinfo" (underscores
#                            and hyphens are interchangeable). Matched directly
#                            against the response's raw headers -- ANY header
#                            can be referenced here with no code change.
#                            Bumps once if any listed header is present and
#                            non-empty.
#   body_contains            arg = substring to find anywhere in the
#                            lowercased response body (your arg is lowercased
#                            automatically). Use this for signals that live
#                            outside href="..." and HTML comments -- e.g.
#                            src="...", inline JSON, or plain visible text.
#   header_contains          arg = "Header=needle". Checks whether the named
#                            response header's VALUE contains 'needle'
#                            (case-insensitive on both sides). Unlike
#                            field_any_nonempty (presence-only -- bumps just
#                            because a header exists), this keys off what the
#                            header actually SAYS, e.g. a Server header that
#                            contains "openresty" or "nginx", or an
#                            X-Powered-By that contains "PHP". Example:
#                              header_contains|Server=openresty|3
#
# All matching rules for a platform sum their weights. A platform needs a
# total score > 1 to be reported (single weak signals are ignored).
#
# TAMPER DETECTION NOTE: rules of kind meta_generator_contains are counted as
# STRUCTURAL evidence by the scorer, so a platform that is also listed in
# [meta_hint_platforms] must NOT have a meta_generator_contains rule of its own:
# a fake generator tag would then "validate itself" and the TAMPER? check could
# never fire for it. The generator tag is already scored through
# [meta_hint_platforms] (+2), which is NOT structural. For that reason the
# original WordPress / Drupal / Magento / Angular meta_generator_contains lines
# are kept below as disabled comments (re-enable only if you don't want TAMPER?
# checking for those platforms).
#
# TAMPER DETECTION: control.cpp also compares the platform these rules find
# from structural evidence (paths/JS-globals/comments/body/headers) against
# whatever the page's own <meta name=generator> tag CLAIMS. A confident
# structural match (score >= 3) for a platform other than the one named in
# the generator tag, while the claimed platform has little/no structural
# backing of its own, is flagged on the version line as "TAMPER? ...". This
# catches the common WAF/honeypot trick of serving a fake generator tag to
# mislead scanners -- faking one meta tag is trivial, faking a whole
# platform's worth of paths/JS globals/body content is not. No signatures.conf
# changes are needed to benefit from this -- it runs automatically against
# whatever [platform.*] / [meta_hint_platforms] sections exist below.
# -----------------------------------------------------------------------------


# #############################################################################
# A. CMS / E-COMMERCE / SITE BUILDERS
