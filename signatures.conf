# =============================================================================
# Shiv web platform/CMS detection signatures
#
# This file drives the HTTP-response platform fingerprinting in control.cpp
# (extract_html_body_signals). It has nothing to do with the nmap-service-probes
# style probe file used by -sV (probe.cpp / AllProbes) -- that is a separate
# stage and is not affected by this file.
#
# Format:
#   - Comments start with '#'. Blank lines are ignored.
#   - Sections are marked with [section_name].
#   - Fields within a line are separated by '|'. Whitespace around each field
#     is trimmed UNLESS noted otherwise below.
#
# If this file is missing or fails to parse, Shiv logs a warning and simply
# runs with platform/CMS detection disabled -- it will not crash the scan.
# =============================================================================


# -----------------------------------------------------------------------------
# [jsglobals]
# JavaScript global variable names to search for inside <script> blocks, as
# either "window.<name>" or "var <name>". One name per line. Matches are
# recorded as "window.<name>" and can be referenced from [platform.*] sections
# via jsglobal_eq.
# -----------------------------------------------------------------------------
[jsglobals]
wordpress
wp
Drupal
Magento
Shopify
Wix
React
Vue
angular
_next
__NEXT_DATA__
__NUXT__
__INITIAL_STATE__
_wpemojiSettings
_wpUtilSettings
ajaxurl
wc_cart_params
ga
gtag
fbq


# -----------------------------------------------------------------------------
# [paths]
# needle|label
# 'needle' is a lowercase substring searched for inside href="..." attribute
# values. On match, an entry "[label] <original-case href value>" is recorded
# and can be referenced from [platform.*] sections via path_contains (matched
# against 'label', i.e. the bracketed part of the recorded entry).
# -----------------------------------------------------------------------------
[paths]
/wp-content/|/wp-content/
/wp-includes/|/wp-includes/
/wp-json/|/wp-json/
/wp-json|wp-json link
/sites/default/|/sites/default/
/skin/frontend/|/skin/frontend/
/media/|/media/
/pub/static/|/pub/static/
/_next/|/_next/
/_nuxt/|/_nuxt/
xmlrpc.php?rsd|xmlrpc.php?rsd
wlwmanifest.xml|wlwmanifest
/feed/|/feed/


# -----------------------------------------------------------------------------
# [attrs]
# attr|label
# 'attr' is a lowercase substring searched for anywhere in the HTML body
# (case-insensitively). On match, an entry "attr:<label>" is recorded into the
# same list as jsglobals matches, and can be referenced via jsglobal_eq using
# "attr:<label>" as the exact-match string.
#
# NOTE: leading/trailing spaces in 'attr' ARE significant and are preserved
# by the parser (only the label half is trimmed) -- e.g. " id=" intentionally
# requires a preceding space so it doesn't match inside other words.
#
# A blank label means "recognized but intentionally suppressed" (kept here so
# the substring is documented; it contributes nothing to detection).
# -----------------------------------------------------------------------------
[attrs]
ng-app=|ng-app
ng-controller=|ng-controller
ng-model=|ng-model
ng-repeat=|ng-repeat
ng-bind=|ng-bind
ng-init=|ng-init
ng-view=|ng-view
ng-if=|ng-if
ng-version=|ng-version
data-ng-app=|data-ng-app
x-ng-app=|x-ng-app
data-reactroot|data-reactroot
data-reactid|data-reactid
data-v-|data-v-*
v-if=|v-if
v-for=|v-for
v-model=|v-model
v-bind=|v-bind
v-on=|v-on
data-app=|data-app
data-version=|data-version
data-product=|data-product
data-framework=|data-framework
<span class=|span-class
 id=|
 name=|


# -----------------------------------------------------------------------------
# [platform.NAME]
# One section per platform/framework being scored. Each line is a rule:
#   kind|arg|weight
#
# kind is one of:
#   path_contains           arg = substring to find in any recorded path entry
#                            (matches the "[label] ..." entries from [paths])
#   jsglobal_eq              arg = exact string to match against a recorded
#                            js-global/attr entry (e.g. "window.Drupal" or
#                            "attr:ng-app")
#   comment_contains         arg = substring to find in any HTML comment
#   meta_generator_contains  arg = substring to find in the <meta name=generator>
#                            header/tag value
#   field_any_nonempty       arg = comma-separated list of HttpFingerprint
#                            field names (see platform_field_registry() in
#                            control.cpp); bumps once if ANY listed field is
#                            non-empty
#
# All matching rules for a platform sum their weights. A platform needs a
# total score > 1 to be reported (single weak signals are ignored).
# -----------------------------------------------------------------------------

[platform.WordPress]
path_contains|/wp-content/|3
path_contains|/wp-includes/|3
path_contains|wlwmanifest|3
path_contains|xmlrpc.php|3
path_contains|wp-json|2
jsglobal_eq|window.wp|2
jsglobal_eq|window.wordpress|2
jsglobal_eq|window._wpemojiSettings|2
jsglobal_eq|window._wpUtilSettings|2
jsglobal_eq|window.ajaxurl|2
jsglobal_eq|window.wc_cart_params|1
comment_contains|WordPress|2
comment_contains|wordpress|2
meta_generator_contains|WordPress|2

[platform.Drupal]
path_contains|/sites/default/|3
jsglobal_eq|window.Drupal|3
comment_contains|Drupal|2
comment_contains|drupal|2
meta_generator_contains|Drupal|2
field_any_nonempty|x_drupal_cache,x_drupal_dynamic_cache|2

[platform.Magento]
path_contains|/skin/frontend/|3
path_contains|/pub/static/|2
jsglobal_eq|window.Magento|3
comment_contains|Magento|2
meta_generator_contains|Magento|2
field_any_nonempty|x_magento_cache_debug|2

[platform.Shopify]
jsglobal_eq|window.Shopify|3
comment_contains|Shopify|2

[platform.Wix]
jsglobal_eq|window.Wix|3
comment_contains|Wix|2
comment_contains|wix.com|2

[platform.Next.js]
path_contains|/_next/|3
jsglobal_eq|window._next|3
jsglobal_eq|window.__NEXT_DATA__|3
comment_contains|Next.js|2

[platform.Nuxt.js]
path_contains|/_nuxt/|3
jsglobal_eq|window.__NUXT__|3

[platform.React]
jsglobal_eq|window.React|1
jsglobal_eq|attr:data-reactroot|3
jsglobal_eq|attr:data-reactid|3

[platform.Vue]
jsglobal_eq|window.Vue|1
jsglobal_eq|attr:data-v-*|3
jsglobal_eq|attr:v-if|2
jsglobal_eq|attr:v-for|2
jsglobal_eq|attr:v-model|2
jsglobal_eq|attr:v-bind|1
jsglobal_eq|attr:v-on|1

[platform.Angular]
jsglobal_eq|window.angular|2
jsglobal_eq|attr:ng-version|3
meta_generator_contains|Angular|2

[platform.AngularJS]
jsglobal_eq|attr:ng-app|3
jsglobal_eq|attr:data-ng-app|3
jsglobal_eq|attr:x-ng-app|3
jsglobal_eq|attr:ng-controller|2
jsglobal_eq|attr:ng-model|2
jsglobal_eq|attr:ng-repeat|2
jsglobal_eq|attr:ng-bind|1
jsglobal_eq|attr:ng-init|1
jsglobal_eq|attr:ng-view|1
jsglobal_eq|attr:ng-if|1


# -----------------------------------------------------------------------------
# [meta_hint_platforms]
# Platform names checked (case-insensitively) as substrings against
# meta_generator / meta_cms / meta_framework / meta_powered_by / meta_built_with.
# Weights are fixed in code: generator/cms/framework = 2, powered_by/built_with = 1.
# -----------------------------------------------------------------------------
[meta_hint_platforms]
WordPress
Drupal
Joomla
Magento
PrestaShop
Ghost
TYPO3
Shopify
Wix
Squarespace
OpenCart
Angular
AngularJS
React
Vue


# -----------------------------------------------------------------------------
# [suppress]
# Platform>=N|SuppressedPlatform
# If 'Platform' scored >= N, force 'SuppressedPlatform' score to 0 (avoids
# double-reporting a meta-framework's underlying library, e.g. Next.js implies
# React).
# -----------------------------------------------------------------------------
[suppress]
Next.js>=2|React
Nuxt.js>=2|Vue
