# ---------------------------------------------------------------------------
# [terms] -- one-pass term scan (see termscan.hpp)
#
#   needle|Product|spec
#
# The needle is searched (case-insensitively) in the WHOLE decoded response:
# status line, header names, header values, <title>, <meta>, comments,
# <script> and body. The region of each hit is derived from its byte offset
# and weighted:
#     H = header value   N = header name   T = <title>   M = <meta>
#     C = HTML comment   S = <script>      B = body      X = raw (non-HTTP) banner
#     A = all regions at once
# Defaults: H3 N3 T2 M2 C1 S1 B1 X3 (status line never scores).
# A product is reported when its summed score is >= 2 (one header/title/meta/
# banner hit is enough; weak body mentions need corroboration).
# The version is the nearest dotted number after the strongest hit, in the
# same header line / tag (<= 96 bytes).
# Other spec flags:  sub = no word boundary,  nover = never extract a version,
#                    strict = version only directly adjacent to the needle.
# Adding a product = adding one line here. No recompile. The compiled
# automaton is cached next to this file as signatures.conf.tscache (keyed by
# a hash of this file, so it can never be stale).
# ---------------------------------------------------------------------------
[terms]

