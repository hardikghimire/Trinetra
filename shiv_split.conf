# shiv_split.conf — default config for --split
# Read from /usr/share/shiv/shiv_split.conf unless a matching --split-*
# option is passed on the command line, which overrides the field here.
#
# Dual-stack: the IPv4 block and the IPv6 block are each independent.
# Fill in one or both. At least one full pair (IP_ADDR+GATEWAY, and/or
# IP6_ADDR+IP6_GATEWAY) is required -- a half-filled pair (address with no
# gateway, or vice versa) is rejected at runtime.


NS="shiv1"                       # informational/log label only
CUSTOM_MAC="00:aa:bb:cc:dd:ee"    # optional; leave empty for kernel-assigned


# --- IPv4 ---
IP_ADDR="192.168.1.114"
IP_PREFIX="24"                   # bare number or dotted netmask, e.g. 255.255.255.0
GATEWAY="192.168.1.254"



