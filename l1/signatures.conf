# signatures.conf — user-editable header/tag/regex signatures for Shiv.
#
# Add a new detection by adding ONE line here — no rebuild required.
# Loaded once at startup from /usr/share/shiv/signatures.conf (see main.cpp).
# Blank lines and lines starting with '#' are ignored.
#
# Three entry shapes, comma-separated "key=value" pairs:
#
#   type=header, name=<Header-Name>, label=<Display Label>, bare=<true|false>
#     A direct, case-insensitive HTTP response header lookup. Position never
#     matters for headers, so this is the simple case.
#
#   type=tag, tag=<tagname>, match_attr=<attr>, match_value=<value>,
#             extract_attr=<attr>, label=<Display Label>, bare=<true|false>
#     Finds every "<tagname ...>" in the HTML body, then — independently of
#     attribute order — checks whether match_attr equals match_value on that
#     tag, and if so extracts extract_attr from it.
#     e.g. <meta name="generator" content="WordPress 6.4"> and
#          <meta content="WordPress 6.4" name="generator">
#     are both matched by the same config line below, regardless of order.
#
#   type=regex, pattern=<regex with exactly one capture group>,
#               label=<Display Label>, bare=<true|false>
#     Escape hatch for anything that isn't a clean header or tag: JS globals,
#     HTML comments, odd inline patterns. Applied against the HTML body.
#     Must have exactly one capture group — that group's text becomes the
#     detected value.
#
# 'bare=true'  -> printed as just the value (use when the value already
#                 names the product, e.g. "WordPress 6.4").
# 'bare=false' -> printed as "Label: value" (use for bare version/ID tokens
#                 that need the label to make sense, e.g. "Jenkins: 2.440.3").
#
# NOTE: the parser splits on literal commas with no quoting/escaping, so no
# field below — including regex patterns — may contain a ',' character.
# Use non-capturing groups (?:...) for anything you don't want extracted,
# and avoid brace quantifiers like {2,4} for the same reason; \d+ / \.\d+
# style patterns say the same thing without a comma.
#
# Everything below this line is additive only: none of it duplicates a
# header, meta tag, or platform marker that Shiv's core (control.cpp) already
# hardcodes natively (Server/X-Powered-By/CF-Ray/Amazon/Google/Azure/cache &
# CDN headers, meta:generator/software/author/framework/cms/etc., and the
# WordPress/Drupal/Magento/Wix/Nuxt/Vue/Angular body-marker scoring engine).

# ---- headers --------------------------------------------------------------
type=header, name=X-Jenkins,          label=Jenkins,          bare=false
type=header, name=X-Runtime,          label=X-Runtime,        bare=false
type=header, name=X-Sourcemap,        label=Sourcemap,        bare=true
type=header, name=X-AspNet-Version,   label=ASP.NET,          bare=false

# -- WordPress-specific (not covered by the wp-content/wp-includes path scorer)
type=header, name=X-Pingback,             label=WordPress (X-Pingback),        bare=false
type=header, name=X-Redirect-By,          label=WP Redirection plugin,          bare=true

