# ---- tags -------------------------------------------------------------------
type=tag, tag=meta, match_attr=name, match_value=generator, extract_attr=content, label=meta:generator, bare=true
type=tag, tag=meta, match_attr=name, match_value=shopify-checkout-api-token, extract_attr=content, label=Shopify, bare=false

# -- WordPress discovery links (distinct from the wp-content/wp-includes
#    path scorer already in control.cpp — these are link-rel based)
type=tag, tag=link, match_attr=rel, match_value=pingback, extract_attr=href, label=WordPress (pingback link), bare=false
type=tag, tag=link, match_attr=rel, match_value=https://api.w.org/, extract_attr=href, label=WordPress REST API, bare=false

# -- Shopify's second identity meta tag (checkout token above only fires on
#    checkout pages; this one shows up on storefront pages instead)
type=tag, tag=meta, match_attr=name, match_value=shopify-digital-wallet, extract_attr=content, label=Shopify, bare=false

# ---- regex fallback ---------------------------------------------------------
# Example: a JS global like `window.__NEXT_DATA__ = {"buildId":"abc123"}`
type=regex, pattern=__NEXT_DATA__\s*=\s*\{"[^"]*":"([a-zA-Z0-9_-]+)", label=Next.js buildId, bare=false

# -- Nuxt.js build id (parallel to the Next.js buildId above; the Nuxt/vue
#    *presence* markers are already handled by the native scoring engine,
#    this pulls the actual build identifier out of window.__NUXT__)
type=regex, pattern=__NUXT__[^;]*buildId["']?\s*:\s*["']([a-zA-Z0-9_-]+)["'], label=Nuxt.js buildId, bare=false

# -- Google Tag Manager container ID (reveals analytics/tag-management stack)
type=regex, pattern=googletagmanager\.com/ns\.html\?id=(GTM-[A-Z0-9]+), label=Google Tag Manager ID, bare=false

# -- Front-end library versions pulled from asset filenames, not from any
#    header or meta tag, so they catch static/CDN-hosted assets the header
#    and tag rules above never see.
type=regex, pattern=jquery[.-]([0-9]+\.[0-9]+\.[0-9]+)(?:\.min)?\.js, label=jQuery version, bare=false
type=regex, pattern=bootstrap[.-]v?([0-9]+\.[0-9]+\.[0-9]+), label=Bootstrap version, bare=false
type=regex, pattern=font-awesome[.-]v?([0-9]+\.[0-9]+\.[0-9]+), label=Font Awesome version, bare=false

# -- WordPress plugin/core versions leaked via the ?ver= cache-busting query
#    string on enqueued assets (classic, very reliable WP version tell)
type=regex, pattern=wp-includes/[^"'\s]+\?ver=([0-9]+\.[0-9]+(?:\.[0-9]+)?), label=WordPress core version, bare=false
type=regex, pattern=elementor/[^"'\s]+\?ver=([0-9]+\.[0-9]+\.[0-9]+), label=Elementor (WordPress) version, bare=false

# -- Classic Yoast SEO HTML comment signature, e.g.:
#    <!-- This site is optimized with the Yoast SEO plugin v21.5 - ... -->
type=regex, pattern=Yoast SEO plugin v([0-9]+\.[0-9]+(?:\.[0-9]+)?), label=Yoast SEO version, bare=false

# -- Shoutcast Server: name+version+platform sit together in the "Built by"
#    anchor text, e.g. "Shoutcast Server v2.6.1.777/posix(linux x64)" — but
#    the page injects <wbr> tags mid-string, which the body-cleaning step
#    above (control.cpp apply_custom_body_signatures) now strips before this
#    pattern runs, so it matches even though the raw HTML looks scrambled.
type=regex, pattern=Shoutcast Server (v[0-9]+(?:\.[0-9]+)+/[a-zA-Z]+\([a-zA-Z0-9_ ]*\)), label=Shoutcast Server, bare=true

